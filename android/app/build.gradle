apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

// ---- load keystore from android/key.properties ----
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties") // => android/key.properties

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.driftring.skia"

    defaultConfig {
        applicationId "com.driftring.skia"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        missingDimensionStrategy 'store', 'play'
        versionCode 15
        versionName "1.0.15"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (!keystorePropertiesFile.exists()) {
                throw new GradleException("Missing android/key.properties (required for release signing).")
            }

            def storeFilePath = keystoreProperties['storeFile']
            if (storeFilePath == null || storeFilePath.toString().trim().isEmpty()) {
                throw new GradleException("storeFile is missing in android/key.properties")
            }

            def ksFile = rootProject.file(storeFilePath)

            if (!ksFile.exists()) {
                throw new GradleException("Keystore file not found: " + ksFile.absolutePath)
            }

            storeFile ksFile
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            // ✅ SIGN WITH UPLOAD KEY (NOT DEBUG)
            signingConfig signingConfigs.release

            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

project(":shopify_react-native-skia") {
    ext {
        enablePrefab = false
    }
}
